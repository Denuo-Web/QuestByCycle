[tool.poetry]
name         = "questbycycle"
version      = "0.2.1"
description  = "QuestByCycle is a Flask-based web application designed to engage and motivate the bicycling community through a gamified approach."
authors      = ["Jaron Rosenau <jaron@rosenau.info>"]
package-mode = false

[tool.poetry.dependencies]
python                = "^3.11"

flask                 = "^3.1.3"
werkzeug              = "^3.1.8"
flask-wtf             = "^1.3.0"
flask-sqlalchemy      = "^3.1.1"
flask-login           = "^0.6.3"
flask-limiter         = "^4.1.1"
sqlalchemy            = "^2.0.52"
psycopg = {extras = ["binary"], version = "^3.3.4"}
wtforms               = "^3.2.2"
email-validator       = "^2.3.0"
cryptography          = "^50.0.0"
pyjwt                 = "^2.13.0"
gunicorn              = "^26.1.0"
apscheduler           = "^3.11.3"
qrcode                = {extras = ["pil"], version = "^8.2"}
openai                = "^3.3.1"
pywebpush             = "^2.4.0"
pytest                = "^9.1.1"
python-dotenv         = "^1.2.3"
rsa                   = "^4.9.1"
html-sanitizer        = "^2.6.0"
requests             = "^2.34.2"
requests-oauthlib     = "^2.0.0"
redis                = "^8.1.0"
rq                   = "^2.11.0"
psycopg2-binary = "^2.9.12"
google-cloud-storage = "^3.13.1"
google-api-python-client = "^2.199.0"
pillow               = "^12.3.0"
flask-humanify = "0.2.8"
pydantic = "^2.13.4"
audioop-lts = {version = "0.2.2", markers = "python_version >= \"3.13\""}

[tool.poetry.scripts]
rqworker = "rq_worker:main"

[build-system]
requires      = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
